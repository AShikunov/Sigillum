<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Круги заклинаний</title>
<style>
:root{color-scheme:dark;--bg:#0f0d18;--panel:#171425;--line:#2c2745;--ink:#e9e0c9;--dim:#8f88a8;--acc:#5ab4ff}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#3b3560 transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif}
.app{display:grid;grid-template-columns:340px 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside header{padding:16px 16px 10px}
h1{font-size:22px;margin:0 0 10px;font-weight:600;letter-spacing:.02em}
input,select,button{font:inherit;color:var(--ink);background:#0f0d18;border:1px solid var(--line);border-radius:6px;padding:7px 10px}
input:focus-visible,select:focus-visible,button:focus-visible,.item:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#q{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{padding:2px 9px;font-size:13px;border-radius:99px;cursor:pointer;color:var(--dim)}
.chip[aria-pressed=true]{color:#0f0d18;font-weight:600}
.range{margin-top:12px;font-size:13px;color:var(--dim)}
.track{position:relative;height:22px;margin-top:4px}
.track::before{content:"";position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--line)}
.fill{position:absolute;top:9px;height:4px;border-radius:2px;background:var(--acc);opacity:.7}
.track input{position:absolute;left:0;top:0;width:100%;height:22px;margin:0;padding:0;border:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.track input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:18px;height:18px;border-radius:50%;background:var(--ink);border:2px solid var(--acc);cursor:pointer}
.track input::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:var(--ink);border:2px solid var(--acc);cursor:pointer}
.track input::-webkit-slider-runnable-track{background:none}
.track input::-moz-range-track{background:none}
#count{font-size:13px;color:var(--dim);padding:0 16px 6px}
#list{overflow:auto;flex:1;margin:0;padding:0;list-style:none}
.item{display:flex;gap:10px;align-items:center;padding:7px 16px;cursor:pointer;border-top:1px solid #1f1b33}
.item:hover,.item[aria-selected=true]{background:#221d38}
.lv{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;border:1.5px solid}
.item b{display:block;font-weight:500;line-height:1.25}
.item small{color:var(--dim)}
.item.rel{padding-left:30px}
.item.rel b{font-weight:400}
main{display:flex;flex-direction:column;align-items:center;padding:18px;overflow:auto;gap:14px}
#stage{width:min(100%,76vh);aspect-ratio:1}
#stage svg{width:100%;height:100%;display:block}
.panel{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:center;max-width:760px}
.panel label{display:flex;flex-direction:column;font-size:13px;color:var(--dim);gap:3px}
#name{width:260px}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
#info{font-size:14px;color:var(--dim);text-align:center}
#info a{color:var(--ink)}
#load{padding:10px 16px;font-size:14px;color:var(--dim);border-top:1px solid var(--line)}
#load summary{cursor:pointer;color:var(--ink)}
#load p{margin:8px 0;font-size:13px}
#loadmsg{margin-top:6px;font-size:13px}
.br{flex-basis:100%;height:0}
.panel label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--ink)}
.ck input{padding:0;width:16px;height:16px;accent-color:var(--acc)}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-30deg)}}
.a{transform-origin:300px 300px;animation:pop .8s cubic-bezier(.2,.8,.2,1) var(--d,0s) backwards}
.tgl[aria-pressed=true]{background:var(--ink);color:#0f0d18;border-color:var(--ink)}
#stage{cursor:pointer}
#paste{width:100%;margin-top:8px;font-size:13px;resize:vertical}
@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto;min-height:100%}aside{border-right:0;border-bottom:1px solid var(--line)}#list{flex:none;max-height:240px}#stage{width:100%}main{overflow:visible}}
</style>
</head>
<body>
<div class="app">
<aside>
  <header>
    <h1>Круги заклинаний</h1>
    <input id="q" type="search" placeholder="Поиск по русскому или английскому названию" aria-label="Поиск">
    <div class="chips" id="chips"></div>
    <div class="chips" id="srcchips"></div>
    <div class="chips" id="toggles">
      <button class="chip tgl" id="relBtn" aria-pressed="true" title="В поиске показывать версии того же заклинания из других источников (по английскому названию)">Связанные версии</button>
      <button class="chip tgl" id="assocBtn" aria-pressed="true" title="Если у версии из другого источника больше данных (дистанция, спасбросок, эффекты…), использовать их для круга">Дополнять из других источников</button>
    </div>
    <div class="range" id="range">
      <div id="rlabel">Уровни: все</div>
      <div class="track"><div class="fill" id="fill"></div><input type="range" id="lmin" min="0" max="9" value="0" aria-label="Уровень от"><input type="range" id="lmax" min="0" max="9" value="9" aria-label="Уровень до"></div>
    </div>
  </header>
  <div id="count"></div>
  <ul id="list" role="listbox" aria-label="Заклинания"></ul>
  <details id="load"><summary>Загрузить свой JSON</summary>
    <p>Массив заклинаний: <code>ru</code>, <code>en</code>, <code>level</code>, <code>school</code> или <code>schoolId</code>; по желанию <code>link</code> и поля из скриптов (<code>v s m conc ritual cast dmg type</code>). В списке они будут как «Свой файл». Файл можно и перетащить на страницу.</p>
    <input type="file" id="file" accept=".json">
    <textarea id="paste" rows="3" placeholder="Или вставьте сюда содержимое JSON"></textarea>
    <button id="pasteBtn" style="margin-top:6px">Загрузить из текста</button> <button id="clearBtn" style="margin-top:6px">Убрать загруженное</button>
    <div id="loadmsg"></div></details>
</aside>
<main>
  <div id="stage"></div>
  <div class="panel">
    <label>Название<input id="name" value="Волшебная стрела"></label>
    <label>Школа<select id="school"></select></label>
    <label>Уровень<select id="level"></select></label>
  </div>
  <div class="panel" id="extra"></div>
  <div id="info"></div>
  <div class="btns">
    <button id="svgBtn">Скачать SVG</button>
    <button id="pngBtn">Скачать PNG</button>
    <button id="animBtn" class="tgl" aria-pressed="true">Анимация</button>
    <button id="realBtn" class="tgl" aria-pressed="true" title="Вкл: одинаковый масштаб, высокий уровень = больший круг. Выкл: круг подгоняется под окно">Масштаб по уровню</button>
  </div>
</main>
</div>

function xmur(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return h>>>0}}
function rng(str){let a=xmur(str)();return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const TAU=Math.PI*2;
const pt=(r,a)=>[300+r*Math.cos(a),300+r*Math.sin(a)];
const f=p=>p[0].toFixed(1)+','+p[1].toFixed(1);
const gcd=(a,b)=>b?gcd(b,a%b):a;

const glyphCache={};
function glyph(ch){
  if(glyphCache[ch])return glyphCache[ch];
  const R=rng('g'+ch),P=()=>[(Math.floor(R()*3)-1)*4,(Math.floor(R()*4)-1.5)*4.5];
  let d='';const n=2+Math.floor(R()*3);
  for(let i=0;i<n;i++){const a=P(),b=P();d+=`M${a[0]} ${a[1]}L${b[0]} ${b[1]}`}
  if(R()<.5){const c=P();d+=`M${c[0]+1.6} ${c[1]}a1.6 1.6 0 1 0-3.2 0a1.6 1.6 0 1 0 3.2 0`}
  return glyphCache[ch]=d;
}
function glyphRing(r,txt,n,sc,rot){
  let s='';
  for(let k=0;k<n;k++){
    const a=rot+k*TAU/n,p=pt(r,a);
    s+=`<path transform="translate(${f(p)}) rotate(${(a*180/Math.PI+90).toFixed(1)}) scale(${sc})" d="${glyph(txt[k%txt.length])}"/>`;
  }
  return s;
}
function starPoly(r,n,rot){
  let k=2+Math.floor(n/5);while(gcd(n,k)!==1)k++;
  if(k>=n/2)k=Math.max(1,Math.floor(n/2)-1);
  let d='';
  for(let i=0;i<=n;i++){d+=(i?'L':'M')+f(pt(r,rot+((i*k)%n)*TAU/n))}
  return `<path d="${d}Z"/>`;
}

  lastSvg=svg;$('#stage').innerHTML=svg;
  if(play&&animOn)animate();
  const S=SCHOOLS[cur.school];
  $('#info').innerHTML=`${S.n}, ${cur.level?cur.level+' уровень':'заговор'} · сид ${seed}`+(tags?`<br>${tags}`:'')+(cur.link&&cur.used&&cur.used.length?`<br>дополнено из: ${cur.used.map(k=>SRC[k]).join(', ')}`:'')+(cur.link?` · <a href="${cur.link}" target="_blank" rel="noopener">открыть на ${cur.link.includes('ttg.club')?'ttg.club':'dnd.su'}</a>`:'');
}
function syncInputs(){
  $('#name').value=cur.name;$('#school').value=cur.school;$('#level').value=cur.level;
  document.querySelectorAll('#extra [data-f]').forEach(c=>c.checked=!!(cur.flags&+c.dataset.f));
  $('#cast').value=cur.cast||'';$('#dmg').value=(cur.dmg||[])[0]||'';$('#save').value=cur.save||'';$('#aoe').value=cur.aoe||'';$('#eff').value=(cur.eff||[])[0]||'';$('#mat').value=String(cur.flags&4?cur.flags&100:0);$('#dist').value=cur.dist||'';$('#dur').value=cur.dur||'';
}
const normEn=s=>String(s||'').toLowerCase().replace(/[^a-z0-9а-яё]/g,'');
const PRI={n:0,t:1,d:2}, LINK=['d','t','n'];
function buildGroups(){groups=new Map();
  spells.forEach((x,i)=>{if(!LINK.includes(x.src)||!x.en)return;const k=normEn(x.en);if(!k)return;
    if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i)})}
const kin=i=>{const x=spells[i];return LINK.includes(x.src)&&x.en?(groups.get(normEn(x.en))||[]).filter(j=>j!==i):[]};
function mergeIn(x,i){
  const o={...x,used:[]};if(!assocOn)return o;
  const sib=kin(i).map(j=>spells[j]).sort((a,b)=>PRI[a.src]-PRI[b.src]);if(!sib.length)return o;
  const used=new Set(),emp=v=>v==null||v===''||(Array.isArray(v)&&!v.length);
  for(const k of ['cast','dmg','type','save','aoe','eff','cond','dist','dur'])if(emp(o[k])){const s=sib.find(s=>!emp(s[k]));if(s){o[k]=s[k];used.add(s.src)}}
  if(o.flags&4)for(const bit of [32,64])if(!(o.flags&bit)){const s=sib.find(s=>(s.flags&4)&&(s.flags&bit));if(s){o.flags|=bit;used.add(s.src)}}
  o.used=[...used];return o}
function drawList(){
  const s=q.trim().toLowerCase(), words=s.split(/\s+/).filter(Boolean);
  const pass=x=>(!fs.size||fs.has(x.schoolId))&&(!ss.size||ss.has(x.src))&&x.level>=lmin&&x.level<=lmax;
  let order=[];const rel=new Set();
  if(!words.length)spells.forEach((x,i)=>{if(pass(x))order.push(i)});
  else{
    const sc=x=>{const a=x.ru.toLowerCase(),b=(x.en||'').toLowerCase();return a===s||b===s?0:a.startsWith(s)||b.startsWith(s)?1:2};
    const hits=[];spells.forEach((x,i)=>{const t=(x.ru+' '+(x.en||'')).toLowerCase();if(words.every(w=>t.includes(w)))hits.push([i,sc(x)])});
    hits.sort((a,b)=>a[1]-b[1]);
    const seen=new Set(),direct=new Set(hits.map(h=>h[0])),add=i=>{if(!seen.has(i)){seen.add(i);order.push(i)}};
    for(const [i] of hits){add(i);if(relOn)for(const j of kin(i)){if(!direct.has(j))rel.add(j);add(j)}}
    order=order.filter(i=>pass(spells[i]));
  }
  const rc=order.filter(i=>rel.has(i)).length;
  $('#count').textContent=`Найдено: ${order.length}`+(rc?` (связанных версий: ${rc})`:'')+(order.length>300?', показаны первые 300':'');
  $('#list').innerHTML=order.slice(0,300).map(i=>{const x=spells[i],S=SCHOOLS[x.schoolId]||SCHOOLS[8];
    return `<li class="item${rel.has(i)?' rel':''}" role="option" tabindex="0" data-i="${i}" aria-selected="${!!x.link&&x.link===cur.link}">
      <span class="lv" style="color:${S.c}">${x.level||'з'}</span><span><b>${x.ru}</b><small>${x.en||''}${x.src?(x.en?' · ':'')+SRC[x.src]:''}${rel.has(i)?' · связано':''}</small></span></li>`}).join('');
}
function pick(i,play){
  const x=mergeIn(spells[i],i);
  cur={name:x.ru,school:x.schoolId,level:x.level,link:x.link||'',en:x.en,flags:x.flags|0,cast:x.cast||'',dmg:x.dmg||[],type:x.type||'',save:x.save||'',aoe:x.aoe||'',eff:x.eff||[],cond:x.cond||[],dist:x.dist||'',dur:x.dur||'',idx:i,used:x.used||[]};
  syncInputs();render(play!==false);drawList();
}
$('#list').addEventListener('click',e=>{const li=e.target.closest('.item');if(li)pick(+li.dataset.i)});
$('#list').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.item')){e.preventDefault();pick(+e.target.dataset.i)}});
$('#q').addEventListener('input',e=>{q=e.target.value;drawList()});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;
  const k=+b.dataset.s;fs.has(k)?fs.delete(k):fs.add(k);
  document.querySelectorAll('#chips .chip').forEach(c=>{const on=fs.has(+c.dataset.s);c.setAttribute('aria-pressed',on);c.style.background=on?SCHOOLS[c.dataset.s].c:'transparent'});
  drawList()});
$('#srcchips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;
  const k=b.dataset.k;ss.has(k)?ss.delete(k):ss.add(k);
  document.querySelectorAll('#srcchips .chip').forEach(c=>{const on=ss.has(c.dataset.k);c.setAttribute('aria-pressed',on);c.style.background=on?'#e9e0c9':'transparent'});
  drawList()});
function updateRange(){
  const a=+$('#lmin').value,b=+$('#lmax').value;
  lmin=Math.min(a,b);lmax=Math.max(a,b);
  const t=v=>v?v:'заговор';
  $('#rlabel').textContent=lmin===0&&lmax===9?'Уровни: все':lmin===lmax?`Уровень: ${t(lmin)}`:`Уровни: от ${t(lmin)} до ${lmax}`;
  const f=$('#fill');f.style.left=`calc(9px + (100% - 18px) * ${lmin/9})`;f.style.width=`calc((100% - 18px) * ${(lmax-lmin)/9})`;
}
function onRange(){updateRange();drawList()}
$('#lmin').addEventListener('input',onRange);$('#lmax').addEventListener('input',onRange);
$('#name').addEventListener('input',e=>{cur={...cur,name:e.target.value,link:'',en:''};render()});
$('#school').addEventListener('change',e=>{cur={...cur,school:+e.target.value,link:''};render()});
$('#level').addEventListener('change',e=>{cur={...cur,level:+e.target.value,link:''};render()});

function animate(){
  const root=document.querySelector('#stage svg > g[filter]');if(!root)return;
  const ph=[[],[],[]];let p=0;
  for(const el of root.children){if(el.dataset.ph){p=+el.dataset.ph;continue}ph[p].push(el)}
  const order=[...ph[2],...ph[1],...ph[0]],step=Math.min(.07,1.1/Math.max(1,order.length));
  order.forEach((el,i)=>{el.classList.add('a');el.style.setProperty('--d',(i*step).toFixed(3)+'s')});
}
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
try{const v=localStorage.getItem('anim');animOn=v===null?!calm:v==='1'}catch(e){animOn=!calm}
$('#animBtn').setAttribute('aria-pressed',animOn);
$('#animBtn').onclick=()=>{animOn=!animOn;$('#animBtn').setAttribute('aria-pressed',animOn);
  try{localStorage.setItem('anim',animOn?'1':'0')}catch(e){}
  render(animOn)};
$('#stage').addEventListener('click',()=>render(true));
try{const v=localStorage.getItem('real');if(v!==null)realSize=v==='1'}catch(e){}
$('#realBtn').setAttribute('aria-pressed',realSize);
$('#realBtn').onclick=()=>{realSize=!realSize;$('#realBtn').setAttribute('aria-pressed',realSize);
  try{localStorage.setItem('real',realSize?'1':'0')}catch(e){}
  render()};
const FL=[['концентрация',8],['ритуал',16],['словесный',1],['соматический',2]];
$('#extra').innerHTML=FL.map(([n,b])=>`<label class="ck"><input type="checkbox" data-f="${b}">${n}</label>`).join('')+
 `<span class="br"></span><label>Время<select id="cast"><option value="">—</option>${Object.entries(CAST).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>`+
 `<label>Урон<select id="dmg"><option value="">—</option>${Object.entries(DMG).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select></label>`+
 `<label>Спасбросок<select id="save"><option value="">—</option>${Object.entries(SV).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>`+
 `<label>Область<select id="aoe"><option value="">—</option>${Object.entries(AOEN).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>`+
 `<label>Эффект<select id="eff"><option value="">—</option>${Object.entries(EFF).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>`+
 `<label>Материал<select id="mat"><option value="0">нет</option><option value="4">обычный</option><option value="36">дорогой</option><option value="68">расходуемый</option><option value="100">дорогой, расходуемый</option></select></label>`+
 `<label>Дистанция<select id="dist"><option value="">—</option>${DISTS.map(v=>`<option>${v}</option>`).join('')}</select></label>`+
 `<label>Длительность<select id="dur"><option value="">—</option>${DURS.map(v=>`<option>${v}</option>`).join('')}</select></label>`;
$('#extra').addEventListener('change',e=>{const t=e.target;
  if(t.dataset.f)cur={...cur,flags:t.checked?cur.flags|+t.dataset.f:cur.flags&~+t.dataset.f,link:''};
  else if(t.id==='cast')cur={...cur,cast:t.value,link:''};
  else if(t.id==='dmg')cur={...cur,dmg:t.value?[+t.value]:[],link:''};
  else if(t.id==='save'||t.id==='aoe')cur={...cur,[t.id]:t.value,link:''};
  else if(t.id==='eff')cur={...cur,eff:t.value?[t.value]:[],link:''};
  else if(t.id==='mat')cur={...cur,flags:(cur.flags&~100)|+t.value,link:''};
  else if(t.id==='dist'||t.id==='dur')cur={...cur,[t.id]:t.value,link:''};
  render()});
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const fname=()=>(cur.en||cur.name||'circle').replace(/[^\wа-яё-]+/gi,'_');
$('#svgBtn').onclick=()=>download(new Blob([lastSvg],{type:'image/svg+xml'}),fname()+'.svg');
$('#pngBtn').onclick=()=>{
  const img=new Image(),url=URL.createObjectURL(new Blob([lastSvg],{type:'image/svg+xml'}));
  img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=1400;c.getContext('2d').drawImage(img,0,0,1400,1400);
    c.toBlob(b=>download(b,fname()+'.png'));URL.revokeObjectURL(url)};
  img.src=url};

try{const a=localStorage.getItem('rel'),b=localStorage.getItem('assoc');if(a!==null)relOn=a==='1';if(b!==null)assocOn=b==='1'}catch(e){}
$('#relBtn').setAttribute('aria-pressed',relOn);$('#assocBtn').setAttribute('aria-pressed',assocOn);
$('#relBtn').onclick=()=>{relOn=!relOn;$('#relBtn').setAttribute('aria-pressed',relOn);try{localStorage.setItem('rel',relOn?'1':'0')}catch(e){}drawList()};
$('#assocBtn').onclick=()=>{assocOn=!assocOn;$('#assocBtn').setAttribute('aria-pressed',assocOn);try{localStorage.setItem('assoc',assocOn?'1':'0')}catch(e){}if(cur.link&&cur.idx!=null)pick(cur.idx,false)};
function drawSrc(){
  const has=spells.some(x=>x.src==='u');if(!has)ss.delete('u');
  $('#srcchips').innerHTML=Object.entries(SRC).filter(([k])=>k!=='u'||has).map(([k,v])=>{const on=ss.has(k);
    return `<button class="chip" data-k="${k}" aria-pressed="${on}" style="border-color:#e9e0c9;background:${on?'#e9e0c9':'transparent'}">${v}</button>`}).join('');
}
const CM={action:'a',bonus:'b',bonus_action:'b',reaction:'r',minute:'m',hour:'h'};
const SID=Object.fromEntries(Object.entries(SCHOOLS).map(([k,v])=>[v.n.toLowerCase(),+k]));
function norm(x){
  const ru=String(x&&(x.ru||(typeof x.name==='string'?x.name:''))||'').trim();
  const level=Number(x&&x.level),sid=Number(x&&x.schoolId)||SID[String(x&&x.school||'').trim().toLowerCase()];
  if(!ru||!(level>=0&&level<=9)||!SCHOOLS[sid])return null;
  const flags=x.flags!=null?x.flags|0:(x.v?1:0)|(x.s?2:0)|(x.m?4:0)|(x.conc?8:0)|(x.ritual?16:0);
  return {ru,en:x.en||'',level,schoolId:sid,src:'u',link:x.link||'',flags,cast:CM[x.cast]||x.cast||'',dmg:Array.isArray(x.dmg)?x.dmg:[],type:x.type||'',save:String(Array.isArray(x.save)?x.save[0]||'':x.save||'').replace(/^s(?=[A-Z])/,''),aoe:Array.isArray(x.aoe)?(x.aoe.find(a=>a!=='aoe')||x.aoe[0]||''):(x.aoe||''),eff:Array.isArray(x.eff)?x.eff:[],cond:Array.isArray(x.cond)?x.cond.map(Number):[],dist:x.dist||x.range||'',dur:x.dur||x.duration||''};
}
function addUser(arr){
  const ok=arr.map(norm).filter(Boolean);
  spells=spells.filter(x=>x.src!=='u').concat(ok);
  $('#loadmsg').textContent=`Загружено: ${ok.length} из ${arr.length}`+(ok.length<arr.length?' (остальные без названия, школы или уровня)':'');
  drawSrc();drawList();
}
function loadText(t){
  try{const a=JSON.parse(t);if(!Array.isArray(a))throw 0;addUser(a)}
  catch(err){$('#loadmsg').textContent='Не разобрано: нужен JSON-массив целиком, от [ до ]'}}
$('#file').addEventListener('change',async e=>{if(e.target.files[0])loadText(await e.target.files[0].text())});
$('#pasteBtn').onclick=()=>loadText($('#paste').value);
$('#clearBtn').onclick=()=>{spells=spells.filter(x=>x.src!=='u');$('#loadmsg').textContent='Загруженное убрано';drawSrc();drawList()};
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',async e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)loadText(await f.text())});

updateRange();syncInputs();render(true);
spells=EMBED.map(a=>({ru:a[0],en:a[1],level:a[2],schoolId:a[3],src:a[4],link:BASE[a[4]]+a[5],flags:a[6],cast:a[7],dmg:a[8],type:a[9],save:a[10]||'',aoe:a[11]||'',eff:a[12]||[],cond:a[13]||[],dist:a[14]||'',dur:a[15]||''}));buildGroups();drawSrc();drawList();
</script>
</body>
